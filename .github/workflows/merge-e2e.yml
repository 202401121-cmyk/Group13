# US-50: a real browser goes from a typed request through the interview to results on every merge to main, against
# the real backend with fake LLM providers and the database off (backend/tests/worst_case/fake_stack.py). No key and no
# network call to our APIs. It aims to end within 5 minutes.
#
# Its own workflow, so every merge is tested: ci.yml cancels a run still going when the next push starts one, and that
# would skip this check for a merge followed closely by another. Here each commit has its own group, never cancelled.
name: Merge e2e

on:
  push:
    branches: [main]

# The job only reads the code; a failure's report goes up as an artifact.
permissions:
  contents: read

concurrency:
  group: merge-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  merge-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json # its engines.node, so Node's major stays in one place (P-09)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Request, interview and results in a browser
        working-directory: frontend
        run: npx playwright test -c e2e/merge/playwright.merge.config.ts
        env:
          MERGE_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: merge-e2e-report
          path: frontend/playwright-report/merge
          retention-days: 14
