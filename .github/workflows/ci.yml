# Runs on every pull request and every push to main. Branch protection on main should require
# the "backend", "ml" and "secrets" jobs (and "frontend" once the app exists) to pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy app
      - name: Tests (no live APIs)
        run: pytest -q -m "not live" --cov --cov-report=term-missing
      - name: Shared contracts are up to date
        run: |
          python -m scripts.export_contracts
          git diff --exit-code -- ../shared/contracts || {
            echo "::error::shared/contracts is out of date. Run 'python -m scripts.export_contracts' and commit.";
            exit 1; }

  # Most members build on Windows; this catches encoding and line-ending bugs the Linux job can't see.
  backend-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (no live APIs)
        run: pytest -q -m "not live"
      - name: Shared contracts are up to date
        run: |
          python -m scripts.export_contracts
          git diff --exit-code -- ../shared/contracts || {
            echo "::error::shared/contracts is out of date. Run 'python -m scripts.export_contracts' and commit.";
            exit 1; }

  # The ml/ workspace (ML-0): standard-library scripts checked with the backend's dev tools and settings.
  # Runs from the repository root, so the backend's config is passed explicitly.
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        run: |
          ruff check --config backend/pyproject.toml ml
          ruff format --check --config backend/pyproject.toml ml
      - name: Types
        run: mypy --config-file backend/pyproject.toml --strict ml/scripts ml/tests
      - name: Tests
        run: python -m pytest ml/tests -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked keys
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # hashFiles() needs a checked-out workspace, so this can't be a job-level `if:` (GitHub
      # rejects the whole workflow file if it is). Check for the app here instead, and skip the
      # rest of the job until it exists.
      - id: has-app
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has-app.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.has-app.outputs.exists == 'true'
      - run: npm run lint
        if: steps.has-app.outputs.exists == 'true'
      - run: npx tsc --noEmit
        if: steps.has-app.outputs.exists == 'true'
      - run: npm test --if-present
        if: steps.has-app.outputs.exists == 'true'
