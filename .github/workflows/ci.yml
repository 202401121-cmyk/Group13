# Runs on every pull request and every push to main. main is not protected, by team decision, so GitHub does not
# enforce these jobs: check they are green before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job only reads the code: checkout fetches it, and TruffleHog scans that clone using the commit SHAs in
# the event payload, without calling the GitHub API. So the token gets nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres that lives for this job only, so the db-marked tests (the requests table migrations and
    # the Postgres request store) run on every pull request. Same major version as the Supabase project (17).
    # Service containers only run on Linux runners, so backend-windows keeps skipping these tests (pytest -rs).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1" # a broken database set-up fails the job instead of skipping the tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy app
      - name: Tests (no live APIs)
        run: pytest -q -m "not live" --cov --cov-report=term-missing
      - name: Coverage gates (70% on core modules, 80% on app/decide/)
        run: python -m scripts.check_coverage
      - name: Shared contracts are up to date
        run: |
          python -m scripts.export_contracts
          git diff --exit-code -- ../shared/contracts || {
            echo "::error::shared/contracts is out of date. Run 'python -m scripts.export_contracts' and commit.";
            exit 1; }

  # Most members build on Windows; this catches encoding and line-ending bugs the Linux job can't see.
  backend-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (no live APIs)
        run: pytest -q -m "not live"
      - name: Shared contracts are up to date
        run: |
          python -m scripts.export_contracts
          git diff --exit-code -- ../shared/contracts || {
            echo "::error::shared/contracts is out of date. Run 'python -m scripts.export_contracts' and commit.";
            exit 1; }

  # The ml/ workspace (ML-0): standard-library scripts checked with the backend's dev tools and settings.
  # Runs from the repository root, so the backend's config is passed explicitly.
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/requirements.txt
      - name: Install
        run: pip install -e "backend[dev]" -r ml/requirements.txt
      - name: Lint
        run: |
          ruff check --config backend/pyproject.toml ml
          ruff format --check --config backend/pyproject.toml ml
      - name: Types
        run: mypy --config-file backend/pyproject.toml --strict ml/scripts ml/tests
      - name: Tests
        run: python -m pytest ml/tests -q
      - name: Smoke runs
        run: |
          python ml/scripts/check_labels.py ml/labelling/pairs_template.csv ml/examples/pairs_labeller_a.csv ml/examples/pairs_labeller_b.csv
          python ml/scripts/kappa.py ml/examples/pairs_labeller_a.csv ml/examples/pairs_labeller_b.csv --min 0.8
      # git ls-files reads the index, so this also catches a file forced in with "git add -f" past .gitignore.
      - name: No raw data or model files tracked
        run: |
          tracked=$(git ls-files -- ml/data/raw ml/models)
          if [ -n "$tracked" ]; then
            echo "::error::Raw data or model files are tracked. Untrack them with 'git rm --cached' (see ml/data/README.md):"
            echo "$tracked"
            exit 1
          fi
          limit=1048576  # 1 MiB
          too_big=0
          while IFS= read -r -d '' f; do
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$f is $size bytes; tracked files under ml/ must be 1 MiB ($limit bytes) or less."
              too_big=1
            fi
          done < <(git ls-files -z -- ml)
          exit "$too_big"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked keys
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # hashFiles() needs a checked-out workspace, so this can't be a job-level `if:` (GitHub
      # rejects the whole workflow file if it is). Check for the app here instead, and skip the
      # rest of the job until it exists.
      - id: has-app
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has-app.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.has-app.outputs.exists == 'true'
      - run: npm run lint
        if: steps.has-app.outputs.exists == 'true'
      - run: npx tsc --noEmit
        if: steps.has-app.outputs.exists == 'true'
      - run: npm test --if-present
        if: steps.has-app.outputs.exists == 'true'
