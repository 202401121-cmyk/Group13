# The 20-brief study (D-55, by-hand job 3; #83, also used by S5-7 and US-51): 20 shopping requests written by people,
# across 4 categories, 2 of them "unseen" (not among the six the app's data covers best:
# smartphone, air_fryer, laptop, smartwatch, earbuds, headphones). Five briefs a category.
#
# Rules:
# - made-up requests only: no real person, address or contact detail;
# - id: short, unique, letters, digits and dashes (b01 to b20 is fine);
# - category: the product kind in lower case with underscores (for example laptop, air_fryer, electric_kettle);
# - unseen: true for the 2 categories outside the six above, false otherwise;
# - request: plain English, as a shopper would type it, with a budget.
#
# Fill in written_by, then the briefs. Example of one entry (not counted, as it is a comment):
#   - id: b01
#     category: laptop
#     unseen: false
#     request: "a light laptop for college under 60000 that lasts all day"
written_by:
  - Rushiraj Navar
  - Om Pandya

