# US-51 paraphrase consistency (D-55, by-hand job 3): 10 pairs of shopping requests, written by people.
# The two requests of a pair ask for the same thing in different words. Both run live through the real pipeline, and
# the same simulated shopper (S4-3's simulator, seeded by the pair's id) answers both interviews, so the pair differs
# only in wording. Target: the top pick matches in at least 8 of the 10 pairs.
#
# Rules:
# - made-up requests only: no real person, address or contact detail;
# - category: one of smartphone, air_fryer, laptop, smartwatch, earbuds, headphones;
# - id: short, unique, letters, digits and dashes (p01 to p10 is fine);
# - a and b: plain English, as a shopper would type them; same budget and same needs, reworded.
#
# Fill in written_by with your names, then the pairs. Example of one entry (not counted, as it is a comment):
#   - id: p01
#     category: earbuds
#     a: "wireless earbuds under 3000 for the gym"
#     b: "I need workout earphones, no wires, budget around 3k"


written_by:
  - Rushiraj Navar
  - Om Pandya

pairs:
