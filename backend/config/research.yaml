# How the research stage fetches (US-12, US-27). Loaded by app/research/settings.py; a bad file logs a warning and the
# defaults there are used, so a typo never stops a search. docs/api-setup.md explains each limit.

pool_size: 6 # one thread pool of this fixed size for all source fetches
deadline_s: 36 # returns whatever finished by then, safely inside the stage's 40-second limit

# At most this many sources of each type. They must add up to 60 or fewer: ResearchResult's own limit.
max_reddit_threads: 20
max_web_results: 20
max_review_pages: 12
max_youtube_videos: 5 # US-38: review videos from the YouTube Data API, each one source; 0 turns YouTube off
youtube_comments_per_video: 20 # the top comments by relevance, their text only
max_pages_per_domain: 3
reddit_comment_threads: 8 # comments are read for this many threads, best score first: what extraction reads in a minute
max_source_tokens: 3000 # the most one source may hold, counted the way the LLM wrapper counts tokens

# A page with less readable text than this probably needs JavaScript, so it goes to the page readers (US-38): Jina
# Reader, then Firecrawl. A reader's text is held to the same threshold.
min_page_chars: 500
max_page_bytes: 1500000

# Our own limits. Arctic Shift (1 a second) and PullPush (1 every 2 seconds) keep theirs in app/research/reddit/.
serper_interval_s: 0.2 # 5 a second: Serper's docs give none we could confirm
page_interval_s: 2.0 # for each review site; a longer Crawl-delay in its robots.txt wins
max_crawl_delay_s: 10 # a site that asks for more is skipped

# What each provider may use. Only requests really sent count; a cache hit is free. A capped provider is skipped, and the
# coverage note says so. Counts live in the git-ignored backend/.cache/research/usage.json, and survive a restart.
caps:
  serper: # research's 6 a search; enrich has its own 6 (D-78, US-41) and commerce its own; the day is shared
    per_search: 6
    per_day: 80 # D-78 (18 Nov 2026): never above 80
    total: 2400 # the free plan is 2,500 queries once, never renewed, so a daily cap alone can't protect it
  reddit_archive: # up to 4 listings, 8 comment reads and 2 retries
    per_search: 14
    per_day: 500
  pages: # robots.txt requests and redirects count too: 12 pages, 7 robots files and a few hops
    per_search: 24
    per_day: 200
  # The page readers (US-38, team's choice, 13 Nov 2026). Jina Reader: pages a plain fetch can't read.
  jina:
    per_search: 10
    per_day: 200
  # Firecrawl (D-62): the pages Jina can't read either, and Reddit threads the archive lacks. D-100 (Om, 27 Nov 2026):
  # the reader ladder's rendered step reads a page again from these, so 8 a search and 150 a day, inside the credits'
  # 300 a day below (D-99).
  firecrawl_pages:
    per_search: 8
    per_day: 150
  # Firecrawl credits, for pages (1 each) and searches (2 a query): research's backup search and commerce's store-page
  # search and page checks (US-24, D-99). Om's student credits (D-99, 25 Nov 2026): 300 a day, and the total stops
  # Firecrawl for good once 9,000 have been used.
  firecrawl:
    per_search: 30
    per_day: 300
    total: 9000
  # YouTube (US-38, docs/api-setup.md). search.list has its own allowance of 100 calls a day; the team's cap is 80.
  # One call a search, and room for its one retry if it fails (US-31): the retry counts toward the 80 too.
  youtube_search:
    per_search: 2
    per_day: 80
  # Quota units, from YouTube's 10,000 a day: videos.list (1 for all the videos) and commentThreads.list (1 a
  # video), 6 a search, plus room for two retries. Our day is UTC, YouTube's ends at midnight Pacific time, so the
  # daily cap stays well under it.
  youtube:
    per_search: 8
    per_day: 9000

# Firecrawl's own limits for our plan (docs.firecrawl.dev/rate-limits, read 25 Nov 2026: the free plan allows 10
# requests a minute and 2 at once; a paid plan allows more). FirecrawlGate keeps inside them; a 429 pauses Firecrawl
# for cool_s. Change them here if the plan changes, never in the code.
firecrawl_limits:
  per_minute: 10
  at_once: 2
  cool_s: 60

# Maker pages (tier 1) and store pages (tier 5), found by search and read like review pages, at most 3 of each a
# search (US-38). They obey robots.txt, and a logged-in page (login, account, cart, checkout) is never read.
max_maker_pages: 3
max_store_pages: 3
maker_domains:
  acer: [acer.com]
  apple: [apple.com]
  asus: [asus.com]
  dell: [dell.com]
  hp: [hp.com]
  lenovo: [lenovo.com]
  lg: [lg.com]
  msi: [msi.com]
  oneplus: [oneplus.in]
  realme: [realme.com]
  samsung: [samsung.com]
  sony: [sony.co.in]
  xiaomi: [mi.com]
  bose: [bose.com]
  noise: [gonoise.com]  # Noise's own store and product pages (S4-17)
  fire-boltt: [fireboltt.com]  # Fire-Boltt's own site (S4-17)
  instant: [instantpot.com, instantpot.com.au]  # Instant Pot's own sites: global, and Australia's (S4-17)
retailer_domains:
  - amazon.in
  - flipkart.com
  - croma.com
  - reliancedigital.in
  - vijaysales.com

# Review sites read directly: found through Serper, with our User-Agent, obeying robots.txt. Their terms still need a
# person's check (docs/api-setup.md). Never list reddit.com or youtube.com: the fetcher refuses them anyway.
review_domains:
  - 91mobiles.com
  - smartprix.com
  - digit.in
  - gadgets360.com
  - notebookcheck.net
  - gsmarena.com
  - rtings.com

# The only uses a search query may hold. The use case is the shopper's own words, so a query never carries it as
# typed: a known use named in it goes in as written here, and anything else is left out. Lowercase words only.
known_uses:
  - coding
  - programming
  - gaming
  - travel
  - office
  - student
  - students
  - video editing
  - photo editing
  - music
  - running
  - gym
  - calls
