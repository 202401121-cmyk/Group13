# Known stores' own websites (US-24). A speed-up, not a gate (D-99, which replaced D-67's list as the gate): commerce
# looks for the store's own page at any store, and checks it before a link is shown (app/commerce/store_pages.py).
#
# - domain: the store's own site. "Amazon" means amazon.in here, never another Amazon.
# - product_path: how the store's own product pages look (a regular expression on the page's path). When a page's
#   address matches, it is a product page without being read. Anything else on the site (a search, a list of products,
#   a blog, a brand page) is read and checked like any store's page. A wrong pattern only means the page is read.
#   Flipkart's and Amazon's were seen live (S4-14, S4-26); the others are the stores' usual form.
stores:
  - name: Flipkart
    domain: flipkart.com
    product_path: "/p/itm[0-9a-z]+"
  - name: Amazon
    domain: amazon.in
    product_path: "/(?:dp|gp/product)/[0-9A-Z]{10}(?:[/?]|$)"
  - name: Croma
    domain: croma.com
    product_path: "/p/[0-9]+(?:[/?]|$)"
  - name: Reliance Digital
    domain: reliancedigital.in
    product_path: "/p/[0-9]+(?:[/?]|$)"
  - name: Vijay Sales
    domain: vijaysales.com
    product_path: "/p/"
