# LLM providers and model limits (US-26). Loaded and checked at startup by app/llm/config.py.
#
# providers: tried in this order when a call fails (fallback order).
# models:    one row per model; each row has exactly the fields of app.contracts.ModelLimits.
#            trains_on_free_tier: true means the free tier may train on prompts, so tasks in
#            PERSONAL_TASKS are never sent there (build rule 8). Gemini must stay true.
#
# Free-tier limits change without notice. Run `python -m scripts.smoke_llm` and copy what you see into
# docs/api-setup.md, then remove the UNVERIFIED comment from each row you confirmed.

providers:
  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    request_timeout_s: 30
  - name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    request_timeout_s: 30
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    request_timeout_s: 30
  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    request_timeout_s: 30

models:
  # The llama-3.3-70b models and gemini-2.5-flash stopped working for us by 3 Nov 2026 (HTTP 404: retired, or not
  # offered to new keys). Windows below come from each provider's model list on that date. The reasoning models
  # (gpt-oss, nemotron) spend some output tokens thinking before they answer, hence the 8192 output budget.
  # Verified 3 Nov 2026 with scripts/smoke_llm.py: valid JSON back.
  - provider: groq
    model: openai/gpt-oss-120b
    context_window_tokens: 131072
    max_output_tokens: 8192
    trains_on_free_tier: false
  # Verified 3 Nov 2026 with scripts/smoke_llm.py. The free tier sometimes answers HTTP 503 (busy); the wrapper
  # then moves on to the next provider.
  - provider: gemini
    model: gemini-3.5-flash
    context_window_tokens: 1048576
    max_output_tokens: 8192
    trains_on_free_tier: true
  # Verified 3 Nov 2026 with scripts/smoke_llm.py. Slower (4 to 7 s); it is the third choice.
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    context_window_tokens: 1000000
    max_output_tokens: 8192
    trains_on_free_tier: false
  # UNVERIFIED: on 3 Nov 2026 Cerebras listed only gpt-oss-120b and qwen-3.8-27b, and every call answered
  # HTTP 402 (the account needs a plan or new credits). The window is a cautious guess until a call works.
  - provider: cerebras
    model: gpt-oss-120b
    context_window_tokens: 65536
    max_output_tokens: 8192
    trains_on_free_tier: false
