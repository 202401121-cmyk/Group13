# LLM providers and model limits (US-26, US-46). Loaded and checked at startup by app/llm/config.py.
#
# providers: how to reach each provider, and what its terms say.
#            json_mode, requests_per_second, requests_per_minute, tokens_per_minute and daily_tokens are optional limits we hold
#            ourselves to (US-46); daily_tokens is counted per UTC day, in memory.
#            trains_on_inputs: may the provider, on the plan we use, train on what we send? true means public
#            data only: private and Reddit text never go there (build rule 8). Each flag comes from the
#            provider's own terms page (terms_url), read on terms_checked. Re-read it when the terms change.
# models:    one row per model; each row has exactly the fields of app.contracts.ModelLimits.
#            trains_on_free_tier must equal its provider's trains_on_inputs. Gemini must stay true.
#            available: false skips a provider with no call, and needs an unavailable_reason.
# routes:    the providers each call may use, in order, by data class and difficulty (US-46). See below.
# pool:      each member is a model with its own limits, which the wrapper paces itself to (US-46). See below.
# force_ipv4: connect to every provider over IPv4 only, because IPv6 can stall on some networks. See docs/api-setup.md.
#
# Free-tier limits change without notice. Run `python -m scripts.smoke_llm` and copy what you see into
# docs/api-setup.md, then remove the UNVERIFIED comment from each row you confirmed. The routing rules (data
# classes, difficulties and why each provider is where it is) are written up in docs/api-setup.md.

force_ipv4: true

providers:
  # "Groq does not retain customer data for inference requests"; its services agreement (section 4.2) does not
  # permit using inputs or outputs for training.
  # Daily tokens (F-4): 3 models x 200,000 a day each (console.groq.com/docs/rate-limits, 7 Nov 2026). Each model is also
  # held to its own 200,000 in pool: below.
  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    request_timeout_s: 30
    trains_on_inputs: false
    terms_url: https://console.groq.com/docs/your-data
    terms_checked: 2026-11-03
    daily_tokens: 600000
  # Unpaid services: prompts may be used to improve Google's products and machine learning, and people may read them.
  # Thinking as low as it goes: it counts against the output limit. On gemini-3.5-flash, on a public page in a live check
  # (9 Nov 2026) with a limit of 1,200, thinking used 1,245 tokens, and the reply was cut off at 43.
  # Free-tier limits of Gemini 3.5 Flash Lite, read from aistudio.google.com/rate-limit on 9 Nov 2026: Google's public
  # rate-limits page lists no numbers for this tier. 15 requests a minute, 250,000 input tokens a minute and 500 requests
  # a day. The 500 a day isn't paced: see docs/api-setup.md. Google publishes no daily token limit, so the daily budget
  # is the team's choice (F-4): 500 requests x 5,000 tokens, the wrapper's planned size for a full source.
  - name: gemini
    requests_per_minute: 15
    tokens_per_minute: 250000
    daily_tokens: 2500000
    limits_checked: 2026-11-09
    reasoning_effort: minimal  # its lowest: Flash Lite has no "none", and answered HTTP 400 to it on 9 Nov 2026
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    request_timeout_s: 30
    trains_on_inputs: true
    terms_url: https://aistudio.google.com/docs/terms
    terms_checked: 2026-11-03
  # Whether a :free model's host trains on prompts depends on that host, and we cannot confirm it for ours.
  # Treated as training until someone can show otherwise.
  # Free models: 20 requests a minute, and 50 a day until the account has bought 10 credits
  # (https://openrouter.ai/docs/api-reference/limits, 3 Nov 2026). No token limit is published, so the daily budget is
  # the team's choice (F-4): 50 requests x 5,000 tokens. The 50 a day is counted too, so a call past it is skipped
  # instead of earning a 429. It takes no turn in bulk work's rotation: it is the fallback after Gemini, Mistral and
  # Groq.
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    request_timeout_s: 30
    trains_on_inputs: true
    terms_url: https://openrouter.ai/docs/features/privacy-and-logging
    terms_checked: 2026-11-03
    requests_per_minute: 20
    requests_per_day: 50
    daily_tokens: 250000
    limits_checked: 2026-11-03
    rotates: false
  # The terms give Cerebras no right to use our content for training, and the privacy policy (section 6) says it
  # does not keep inputs and outputs. Every call answers HTTP 402 (no free tier), so it is skipped with no call,
  # and it left the private and reddit routes on 7 Nov 2026. If the account gets credits: set available: true,
  # run the smoke test, and put it back in those routes as a team decision.
  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    request_timeout_s: 30
    trains_on_inputs: false
    terms_url: https://cerebras.ai/terms-of-service
    terms_checked: 2026-11-03
    daily_tokens: 1000000  # while a trial credit lasts (inference-docs.cerebras.ai/support/rate-limits, 3 Nov 2026)
    available: false
    unavailable_reason: HTTP 402, no free tier (smoke test, 3 Nov 2026)
  # The free plan ("Free mode") may use inputs and outputs to train. An opt-out exists, but we cannot confirm it is
  # set for our key, so Mistral stays public data only.
  - name: mistral
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    request_timeout_s: 30
    trains_on_inputs: true
    terms_url: https://help.mistral.ai/en/articles/347617
    terms_checked: 2026-11-03
    json_mode: true
    # Its real limits, from the rate-limit headers of a live reply on 10 Nov 2026 (x-ratelimit-limit-req-minute: 2,
    # x-ratelimit-limit-tokens-minute: 40000). On 3 Nov 2026 they had said 188 requests and 625,000 tokens a minute,
    # so read them again if Mistral answers 429s (python -m scripts.smoke_apis --only mistral). The monthly allowance
    # is shown only in Mistral's Admin Panel > API > Limits: set MISTRAL_DAILY_TOKENS in .env to that allowance / 31,
    # less 10%. These can also be set with MISTRAL_RPM, MISTRAL_RPS, MISTRAL_TPM and MISTRAL_DAILY_TOKENS, and the
    # model with MISTRAL_MODEL.
    requests_per_minute: 2
    tokens_per_minute: 40000
    limits_checked: 2026-11-10
    daily_tokens: 1000000

models:
  # The llama-3.3-70b models and gemini-2.5-flash stopped working for us by 3 Nov 2026 (HTTP 404: retired, or not
  # offered to new keys). Windows below come from each provider's model list on that date. The reasoning models
  # (gpt-oss, nemotron) spend some output tokens thinking before they answer, hence the 8192 output budget.
  # Verified 3 Nov 2026 with scripts/smoke_llm.py: valid JSON back.
  - provider: groq
    model: openai/gpt-oss-120b
    context_window_tokens: 131072
    max_output_tokens: 8192
    trains_on_free_tier: false
  # Verified 7 Nov 2026 with scripts/smoke_apis.py: both answered. Windows from Groq's models page, 7 Nov 2026. It
  # lists 65,536 and 16,384 as the most these can write; 8192 is
  # our own cap, as above. qwen3.8-27b is a preview model, so Groq may withdraw it. A retired model is skipped for the
  # run, one that isn't found is skipped for 10 minutes, and either way the pool carries on with the other two.
  - provider: groq
    model: openai/gpt-oss-20b
    context_window_tokens: 131072
    max_output_tokens: 8192
    trains_on_free_tier: false
  - provider: groq
    model: qwen/qwen3.8-27b
    context_window_tokens: 131072
    max_output_tokens: 8192
    trains_on_free_tier: false
  # Listed by Google's models API on 9 Nov 2026, with a window of 1,048,576 and an output limit of 65,536. The free tier
  # sometimes answers HTTP 503 (busy); the wrapper then moves on to the next provider.
  - provider: gemini
    model: gemini-3.5-flash-lite
    context_window_tokens: 1048576
    max_output_tokens: 8192
    trains_on_free_tier: true
  # Verified 3 Nov 2026 with scripts/smoke_llm.py. Slower (4 to 7 s); it is the third choice.
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    context_window_tokens: 1000000
    max_output_tokens: 8192
    trains_on_free_tier: true
  # UNVERIFIED: on 3 Nov 2026 Cerebras listed only gpt-oss-120b and qwen-3.8-27b, and every call answered
  # HTTP 402 (the account needs a plan or new credits). The window is a cautious guess until a call works.
  - provider: cerebras
    model: gpt-oss-120b
    context_window_tokens: 65536
    max_output_tokens: 8192
    trains_on_free_tier: false
  # Verified 3 Nov 2026 with a live call: valid JSON back. Ministral 3 8B (ministral-8b-2512); the window is the
  # one the API reports. mistral-small-latest answered HTTP 429 with a limit of 0 requests a minute on our key.
  - provider: mistral
    model: ministral-8b-latest
    context_window_tokens: 262144
    max_output_tokens: 4096
    trains_on_free_tier: true

# Every call says what its prompt carries (data class) and how big the job is (difficulty); this table gives the
# providers to try for that pair, in order. The loader refuses a private or reddit route that names a provider
# with trains_on_inputs: true, or a private or reddit route that names an unavailable provider. Within a route, a
# provider that is unavailable, cooling down, dead for the run, out of today's budget or without a key is skipped.
# If none is left, the stage uses its own fallback: keyword rules for private tasks, skip the source for extraction.
#   private: the shopper's own words.          reddit: posts and comments from Reddit.
#   public:  our own fixed text, or public web pages.
#   short: a small prompt and answer.  medium: a longer answer.  long: a long input (many pages or comments).
# task_settings: fields sent with one task's calls to one model, on top of its provider's own. Each model takes its own
# values (console.groq.com/docs/reasoning, read 9 Nov 2026). A task or a model not listed sends none of these.
# gpt-oss-20b spent all 1,200 output tokens thinking in P10's live runs, and each such source was lost.
task_settings:
  extract_claims:
    openai/gpt-oss-120b: {reasoning_effort: low, include_reasoning: false}
    openai/gpt-oss-20b: {reasoning_effort: low, include_reasoning: false}
    qwen/qwen3.8-27b: {reasoning_effort: "none"}

routes:
  private:
    short: [groq]
    medium: [groq]
    long: [groq]
  reddit:
    short: [groq]
    medium: [groq]
    long: [groq]
  # Public bulk work takes turns between the providers that rotate and are not Groq. Groq's models are the private and
  # Reddit pool, so a public page goes to them only as the last resort: when none of those has room, and only if a
  # Groq model has room right now, outside the shopper's reserve (F-6, 10 Nov 2026). OpenRouter comes after them all.
  # A task that isn't bulk work keeps the route's order as written; only extraction uses public long today.
  public:
    short: [mistral, groq]
    medium: [mistral, gemini, groq, openrouter]
    long: [gemini, mistral, groq, openrouter]

# Each member paces itself to its own limits, so a call waits for a slot instead of earning a 429. The token count is
# the input the wrapper measures plus the requested output, so one call can never be bigger than tokens_per_minute.
# Run `python -m scripts.smoke_apis --only groq`: if the API's headers differ from these numbers, the headers win.
# reddit_tokens_per_search: what a search's Reddit extraction may use. A call's whole request counts while it runs, then
# its real use if book_real_use is on. The extract stage keeps to it (US-14), and skips the Reddit sources past it. It fits in about one minute of the pool's combined token rate, above the reserve.
# extract_reserve_tokens_per_minute: what bulk work must leave of each member's minute (US-14), so intake and reply
# parsing, which plan about 1,700, always find room. Extraction waits inside its stage limit, or skips the source.
# 7 Nov 2026: a full source used 3,216 tokens and the wrapper planned 5,129, so 18,000 is about 3 full-size sources
# as the pool counts them. It is 75% of the 24,000 a minute. Re-measure with
# `python -m scripts.smoke_apis --measure-extraction`.
pool:
  limits_url: https://console.groq.com/docs/rate-limits
  limits_checked: 2026-11-07
  reddit_tokens_per_search: 18000
  extract_reserve_tokens_per_minute: 2000
  # public_output_tokens: the answer a public page asks a member for when Groq reads it as the last resort (F-6). With
  # extraction's 2,000 for public pages, a page at research's 3,000-token cap could not go whole beside the reserve
  # (8,000 - 2,000 - 2,000 leaves 4,000 for a prompt of up to about 4,800), and a page is never trimmed: trimming could
  # cut its data block's closing marker. 1,200 is what a Reddit source asks Groq for; live public answers used 428 to
  # 669 tokens on 10 Nov 2026. A page that still can't go whole is skipped, and the next provider is tried.
  public_output_tokens: 1200
  # A call holds its input and whole requested output while it runs, then books what it really used. A failed call books
  # nothing unless its reply reports a use. Groq doesn't charge the requested output in full: on 9 Nov 2026, two calls asking
  # for 1,200 each, with a prompt and reply of 95, moved x-ratelimit-remaining-tokens by 334 and 49 (docs/api-setup.md). Set
  # this to false if that changes: the pool and the extract stage's Reddit budget then both go back to counting holds.
  book_real_use: true
  members:
    - provider: groq
      model: openai/gpt-oss-120b
      requests_per_minute: 30
      tokens_per_minute: 8000
      tokens_per_day: 200000
      requests_per_day: 1000
    - provider: groq
      model: openai/gpt-oss-20b
      requests_per_minute: 30
      tokens_per_minute: 8000
      tokens_per_day: 200000
      requests_per_day: 1000
    - provider: groq
      model: qwen/qwen3.8-27b
      requests_per_minute: 30
      tokens_per_minute: 8000
      tokens_per_day: 200000
      requests_per_day: 1000
