[build-system]
requires = ["setuptools>=64"]  # 64+ builds editable installs (pip install -e)
build-backend = "setuptools.build_meta"

[project]
name = "shopsense-backend"
version = "0.1.0"
description = "ShopSense: personalised, sourced product research"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",  # 2.10: a default_factory may read the fields already validated (HardRule.id)
    # Pinned exactly: search runs (US-12) stream progress with fastapi.sse, which came in 0.135.0.
    "fastapi==0.162.2",
    "uvicorn[standard]>=0.30",
    # Pinned exactly: app/llm/providers.py calls a private httpx function, and tests/unit/llm/test_http_client.py reads
    # private attributes of both.
    "httpx==0.28.1",
    "httpcore==1.0.9",
    # 1.2.4: "KEY=   # note" reads as empty (1.2.3 and older took "# note" as the value, so a .env copied from
    # .env.example stopped the LLM settings loading), and PYTHON_DOTENV_DISABLED keeps a developer's .env out of tests.
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    # The Postgres request store (US-01). Pinned exactly: the driver decides how timeouts behave.
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    # Reddit's own API (US-12), used only with REDDIT_SOURCE=official. Pinned exactly, like the database driver.
    "praw==8.0.3",
    # The match stage's fuzzy scorer (US-15). Pinned to ml/requirements.txt's version (D-57), so the stage scores pairs
    # exactly as the baseline in ml/MODELS.md card 8 did.
    "rapidfuzz==3.14.6",
    # The trained matcher (US-15, S3-15), run on CPU through ONNX (D-64, P-10). Pinned exactly after checking PyPI on
    # 14 Nov 2026. onnxruntime: the version S3-4 checked the export and timed with (ml/results/matcher_v1_onnx.json),
    # not 1.32.0, a day old. huggingface_hub: the last 1.x line, on httpx<1; 2.x pulls in httpx2, which starlette's
    # TestClient then uses instead of the pinned httpx above. numpy: ml/requirements.txt's version (2.5 needs 3.12).
    # They are imported only when MATCHER=model loads the model (app/entities/model.py).
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "huggingface_hub==1.33.0",
    "numpy==2.4.6",
]
# Stories add their own libraries when they need them (for example sentence-transformers,
# rapidfuzz, pyahocorasick, numpy, slowapi). Add them here in the same pull request.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Pinned so a new release can't turn CI red; upgrade them on purpose, in their own pull request.
    "ruff==0.17.2",
    "mypy==2.4.0",
]

# Only `app` is installed. Listing it explicitly means other folders in backend/ (config/, scripts/, tests/,
# and any data folder a later story adds) never break `pip install -e .` with "Multiple top-level packages".
[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A plain `pytest` is the fast run. CI passes its own -m "not live", which replaces this one, so CI still runs the slow tests.
addopts = '-q --strict-markers -m "not slow and not live"'
markers = [
    "slow: really waits, for a timeout or a breaker; left out of a plain pytest run (pytest -m slow runs them)",
    "live: calls a real external API; never runs in CI (use only in evals/online)",
    "db: needs a Postgres from TEST_DATABASE_URL; skipped without it, failed without it when REQUIRE_DB_TESTS=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the ₹ sign and typographic quotes in text

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]  # it ships no type hints
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
